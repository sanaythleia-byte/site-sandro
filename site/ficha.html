<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ficha de pré-diagnóstico | Sanaythle Informática</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#071A33;--blue:#0A58CA;--orange:#F97316;--ink:#0F172A;--muted:#5B6B80;--line:#D9E1EC;--soft:#F4F7FC}
*{box-sizing:border-box}
body{margin:0;background:#E9EEF5;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.45}
.bar{max-width:820px;margin:24px auto 0;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.bar button{min-height:44px;padding:0 20px;border-radius:999px;border:0;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--blue);color:#fff}
.bar button.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.sheet{max-width:820px;margin:16px auto 40px;background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(7,26,51,.12);padding:40px 44px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:3px solid var(--navy)}
.brand{display:flex;gap:12px;align-items:center}
.brand img{width:56px;height:auto}
.brand b{display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:20px;color:var(--navy);letter-spacing:.02em}
.brand small{display:block;font-size:12px;color:var(--muted)}
.proto{text-align:right}
.proto .t{font-family:Montserrat,sans-serif;font-weight:800;font-size:15px;color:var(--navy);text-transform:uppercase;letter-spacing:.06em}
.proto .n{display:inline-block;margin-top:6px;background:var(--orange);color:#fff;font-weight:700;padding:4px 12px;border-radius:999px;font-size:14px}
.proto .d{margin-top:6px;color:var(--muted);font-size:13px}
h2{font-family:Montserrat,sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:18px;height:3px;background:var(--orange);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cell{padding:10px 14px;border-bottom:1px solid var(--line);margin-bottom:-1px}
.cell:nth-child(odd){border-right:1px solid var(--line)}
.cell span{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cell b{font-weight:600;font-size:15px}
.cell.full{grid-column:1/-1;border-right:0}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:10px;overflow:hidden}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:first-child{width:38%;color:var(--muted);background:var(--soft);font-weight:500}
td:last-child{font-weight:600}
.obs{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;white-space:pre-wrap}
.tech{border:1.5px dashed #9FB2CC;border-radius:10px;padding:14px 16px}
.line{border-bottom:1px solid #B9C6D8;height:30px}
.row{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px}
.row div{flex:1 1 200px}
.row label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chk{display:inline-flex;align-items:center;gap:6px;margin-right:18px;font-weight:500}
.chk i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block}
footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.err{max-width:820px;margin:40px auto;background:#fff;border-radius:16px;padding:32px;text-align:center}
@media (max-width:640px){.sheet{padding:24px 18px;border-radius:0}.grid{grid-template-columns:1fr}.cell:nth-child(odd){border-right:0}header{flex-direction:column}.proto{text-align:left}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;font-size:12pt}
 .bar{display:none}
 .sheet{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar"><button type="button" class="sec" id="copy">Copiar resumo</button><button type="button" id="print">Imprimir ou salvar em PDF</button></div>
<main class="sheet" id="sheet"></main>
<script>
(function(){
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var D=null;
try{var b=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
 var bin=atob(b),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
 D=JSON.parse(new TextDecoder().decode(bytes));}catch(e){}
var S=document.getElementById('sheet');
if(!D){S.outerHTML='<div class="err"><h1 style="font-family:Montserrat,sans-serif">Ficha não encontrada</h1><p>Abra esta página pelo link que chega no e-mail do pré-diagnóstico.</p></div>';document.querySelector('.bar').style.display='none';return;}
var dt=D.d?new Date(D.d):null;
var when=dt?dt.toLocaleDateString('pt-BR')+' às '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
var tel=(D.t||'').replace(/\D/g,'');if(tel&&tel.length<=11)tel='55'+tel;
var h='<header><div class="brand"><img src="/logo-simbolo.png" alt=""><div><b>SANAYTHLE</b><small>Informática · Suporte Técnico<br>(91) 98888-9480 · Ananindeua - PA</small></div></div>';
h+='<div class="proto"><div class="t">Ficha de pré-diagnóstico</div><div class="n">'+esc(D.p)+'</div><div class="d">Recebido em '+esc(when)+'</div></div></header>';
h+='<h2>Cliente</h2><div class="grid"><div class="cell"><span>Nome</span><b>'+esc(D.n||'Não informado')+'</b></div><div class="cell"><span>WhatsApp</span><b>'+(tel?'<a href="https://wa.me/'+tel+'" style="color:inherit">'+esc(D.t)+'</a>':'')+'</b></div>';
h+='<div class="cell"><span>Melhor horário</span><b>'+esc(D.h||'Qualquer horário')+'</b></div><div class="cell"><span>Tipo de uso</span><b>'+esc(D.u||'Não informado')+'</b></div></div>';
h+='<h2>Equipamento e problema</h2><div class="grid"><div class="cell"><span>Equipamento</span><b>'+esc(D.e||'Não informado')+'</b></div><div class="cell"><span>Desde quando</span><b>'+esc(D.q||'Não informado')+'</b></div><div class="cell full"><span>Problema relatado</span><b>'+esc(D.pr)+'</b></div></div>';
if(D.r&&D.r.length){h+='<h2>Respostas do cliente</h2><table>'+D.r.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>';}).join('')+'</table>';}
h+='<h2>Observações do cliente</h2><div class="obs">'+esc(D.o||'Nenhuma')+'</div>';
h+='<h2>Uso do técnico</h2><div class="tech"><label style="font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em">Diagnóstico técnico</label><div class="line"></div><div class="line"></div><div class="line"></div>';
h+='<div class="row"><div><label>Orçamento (R$)</label><div class="line"></div></div><div><label>Prazo previsto</label><div class="line"></div></div></div>';
h+='<div class="row"><div><label>Aprovado pelo cliente</label><div style="margin-top:8px"><span class="chk"><i></i>Sim</span><span class="chk"><i></i>Não</span></div></div><div><label>Garantia</label><div style="margin-top:8px"><span class="chk"><i></i>90 dias</span><span class="chk"><i></i>30 dias</span></div></div></div>';
h+='<div class="row"><div><label>Técnico responsável</label><div class="line"></div></div><div><label>Data de entrega</label><div class="line"></div></div></div></div>';
h+='<footer><span>Sanaythle Informática · Rua Castelo Branco, 75 – Icuí-Guajará, Ananindeua - PA</span><span>sanaythleti@gmail.com</span></footer>';
S.innerHTML=h;document.title='Ficha '+D.p+' – '+(D.n||'Cliente')+' | Sanaythle';
document.getElementById('print').onclick=function(){window.print();};
document.getElementById('copy').onclick=function(){
 var t='Pré-diagnóstico '+D.p+'\nCliente: '+(D.n||'')+'\nWhatsApp: '+(D.t||'')+'\nEquipamento: '+(D.e||'')+'\nProblema: '+(D.pr||'')+'\n'+(D.r||[]).map(function(r){return r[0]+': '+r[1];}).join('\n')+(D.o?'\nObservações: '+D.o:'');
 var b=this;navigator.clipboard.writeText(t).then(function(){b.textContent='Copiado!';setTimeout(function(){b.textContent='Copiar resumo';},2000);},function(){b.textContent='Não foi possível copiar';});};
})();
</script>
</body>
</html>
